<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boid</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/xterm.js"></script>
  <script defer src="/vendor/addon-fit.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="disconnected">
  <nav class="workspace-actions" aria-label="Workspace">
    <button id="add-agent" type="button" aria-label="New agent" title="New agent" disabled>+agent</button>
    <button id="add-terminal" type="button" aria-label="New terminal" title="New terminal" disabled>+terminal</button>
    <button id="open-diagnostics" type="button" aria-label="Diagnostics" title="Diagnostics" aria-haspopup="dialog" aria-controls="diagnostics-dialog" disabled>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor"><path d="M2 10V6m4 4V2m4 8V4" stroke-width="1.5"/></svg>
    </button>
  </nav>
  <div id="workspace-error" class="error-banner" role="alert" hidden></div>
  <form id="login" hidden>
    <button id="passkey-sign-in" type="button" hidden>Sign in with passkey</button>
    <button id="passkey-enroll" type="button" hidden>Create passkey</button>
    <div id="token-fallback">
      <label>Server token <input id="token" type="password" autocomplete="off" required></label>
      <button type="submit">Connect</button>
      <span>Use the token printed by the Boid server.</span>
    </div>
  </form>
  <main id="workspace" aria-label="Agent and terminal workspace">
    <p id="empty">Start an agent or open a terminal.</p>
  </main>
  <dialog id="diagnostics-dialog" aria-labelledby="diagnostics-title">
    <header class="diagnostics-header">
      <h1 id="diagnostics-title">Diagnostics</h1>
      <button id="close-diagnostics" type="button" aria-label="Close diagnostics">×</button>
    </header>
    <select id="diagnostics-scope" aria-label="Agent usage"><option value="">All agents</option></select>
    <p id="diagnostics-error" class="error-banner" role="alert" hidden></p>
    <div id="diagnostics-content" aria-live="polite"></div>
  </dialog>
  <section id="provider-login" class="login-picker" aria-label="Login" hidden>
    <header class="login-heading"><strong>/login</strong><button id="close-provider-login" type="button" aria-label="Close login">×</button></header>
    <div class="login-methods" aria-label="Login method">
      <button type="button" data-login-method="api_key" aria-pressed="false">API key</button>
      <button type="button" data-login-method="chatgpt" aria-pressed="false">ChatGPT subscription</button>
    </div>
    <p id="provider-login-error" class="error-banner" role="alert" hidden></p>
    <form id="api-key-login" hidden>
      <label id="api-key-label">OpenAI API key <input id="provider-api-key" type="password" autocomplete="off" spellcheck="false"></label>
      <p id="api-key-ready" hidden>A server API key is configured.</p>
      <button type="submit">Use API key</button>
    </form>
    <div id="subscription-login" hidden>
      <button id="chatgpt-sign-in" type="button" data-oai-siwc-button>Continue with ChatGPT</button>
      <form id="subscription-selection" hidden>
        <label>Account <select id="subscription-account" required></select></label>
        <button type="submit">Use subscription</button>
      </form>
      <div id="subscription-actions"></div>
    </div>
    <p id="provider-login-status" role="status"></p>
  </section>
  <dialog id="plan-welcome" aria-labelledby="plan-welcome-title">
    <h1 id="plan-welcome-title">You're using your ChatGPT plan</h1>
    <p>Eligible requests use your ChatGPT plan or credits. Review limits and access in ChatGPT settings.</p>
    <form method="dialog"><button>Got it</button></form>
  </dialog>
</body>
</html>
