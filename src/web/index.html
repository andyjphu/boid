<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boid</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/xterm.js"></script>
  <script defer src="/vendor/addon-fit.js"></script>
  <script defer src="/app.js"></script>
</head>
<body class="disconnected">
  <nav class="workspace-actions" aria-label="Create">
    <button id="add-agent" type="button" disabled>+ agent</button>
    <button id="add-terminal" type="button" disabled>+ terminal</button>
  </nav>
  <div id="workspace-error" class="error-banner" role="alert" hidden></div>
  <form id="login" hidden>
    <label>Server token <input id="token" type="password" autocomplete="off" required></label>
    <button type="submit">Connect</button>
    <span>Use the token printed by the Boid server.</span>
  </form>
  <main id="workspace" aria-label="Agent and terminal workspace">
    <p id="empty">Start an agent or open a terminal.</p>
  </main>
</body>
</html>
