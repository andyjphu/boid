[package]
name = "boid"
version = "1.1.24"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
jsonwebtoken = "9.3"
axum = { version = "0.8", features = ["ws"] }
eventsource-stream = "0.2"
futures-util = "0.3"
httpdate = "1"
libc = "0.2"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.6.2", default-features = false }
